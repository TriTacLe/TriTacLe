name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=TriTacLe&show_icons=true&theme=radical&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=TriTacLe&layout=compact&theme=radical&hide=lua,systemd,maven%20pom,cmake,java%20module,mdx,gitignore%20file,csv%2Ftsv,javascript,vue.js,astro,svelte,dart,glsl,other,markdown,toml,json,yaml,vue,image%20(svg),makefile,css,xml,git%20config,docker,java%20properties,csv,tex,gitignore,text,html,ini,sshconfig,http%20request,nginx%20configuration%20file,jupyter%20notebook,plantuml,prisma,conf,ignore%20list,properties,hyprlang,tsconfig,mermaid,dockerfile&langs_count=14
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate editors and OS cards
        run: python3 .github/scripts/wakatime_cards.py profile

      # Force-push cards to a one-commit orphan branch so master history stays clean.
      - name: Publish cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd profile
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -q -m "Update README cards"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
